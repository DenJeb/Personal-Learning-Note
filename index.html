<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人学习笔记</title>
  <link rel="stylesheet" href="assets/github.min.css">
  <style>
    :root {
      --brand: #7c3aed;
      --brand-dark: #6d28d9;
      --brand-soft: #f3e8ff;
      --bg: #f6f7f9;
      --sidebar-bg: #ffffff;
      --border: #e5e7eb;
      --text: #24292f;
      --text-secondary: #57606a;
      --code-bg: #f6f8fa;
      --code-border: #d8dee4;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      font-size: 16px;
    }

    /* ---------- 侧边栏 ---------- */
    .sidebar {
      position: fixed;
      top: 0; left: 0; bottom: 0;
      width: 280px;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      padding: 24px 16px;
      z-index: 50;
      transition: transform .25s ease;
    }

    .site-name {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 20px;
      padding: 0 8px;
      background: linear-gradient(120deg, var(--brand) 0%, #3b82f6 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .nav-group {
      margin-top: 18px;
      padding: 0 8px;
      font-size: 12px;
      color: #9ca3af;
      letter-spacing: 1px;
    }

    .nav-link {
      display: block;
      padding: 8px 12px;
      margin: 2px 0;
      border-radius: 8px;
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 14.5px;
      transition: background .15s, color .15s;
    }

    .nav-link:hover { background: #f3f4f6; color: var(--text); }

    .nav-link.active {
      background: var(--brand-soft);
      color: var(--brand-dark);
      font-weight: 600;
    }

    /* ---------- 内容区 ---------- */
    .content {
      margin-left: 280px;
      padding: 40px 24px 80px;
    }

    .content-inner {
      max-width: 860px;
      margin: 0 auto;
    }

    article { animation: fadeIn .25s ease; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: none; }
    }

    /* ---------- Markdown 排版 ---------- */
    article h1 {
      font-size: 2em;
      padding-bottom: .35em;
      margin-bottom: .6em;
      border-bottom: 1px solid var(--border);
    }
    article h2 { font-size: 1.5em; margin: 1.6em 0 .7em; }
    article h3 { font-size: 1.22em; margin: 1.4em 0 .6em; }
    article h4 { font-size: 1.05em; margin: 1.2em 0 .5em; }
    article p { margin: .8em 0; }
    article ul, article ol { margin: .8em 0; padding-left: 1.6em; }
    article li { margin: .25em 0; }
    article a { color: var(--brand-dark); text-decoration: none; }
    article a:hover { text-decoration: underline; }

    article code {
      font-family: "JetBrains Mono", "Cascadia Code", Consolas, "Courier New", monospace;
      font-size: .9em;
      background: #eff1f3;
      border-radius: 4px;
      padding: 2px 6px;
    }

    article pre {
      background: var(--code-bg);
      border: 1px solid var(--code-border);
      border-radius: 10px;
      padding: 14px 16px;
      overflow-x: auto;
      margin: 1em 0;
    }

    article pre code {
      background: none;
      padding: 0;
      font-size: 13.5px;
      line-height: 1.6;
    }

    article pre code.hljs { background: none; }

    article table {
      border-collapse: collapse;
      margin: 1em 0;
      display: block;
      max-width: 100%;
      overflow-x: auto;
    }
    article th, article td {
      border: 1px solid var(--code-border);
      padding: 7px 14px;
      text-align: left;
    }
    article th { background: var(--code-bg); font-weight: 600; }

    article blockquote {
      border-left: 4px solid var(--brand);
      background: #faf5ff;
      border-radius: 0 8px 8px 0;
      padding: 10px 16px;
      margin: 1em 0;
      color: #4b5563;
    }
    article blockquote p { margin: .3em 0; }

    article img {
      max-width: 100%;
      border-radius: 10px;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
      margin: .6em 0;
    }

    article hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 2em 0;
    }

    ::selection { background: var(--brand-soft); }

    /* ---------- 滚动条 ---------- */
    .sidebar::-webkit-scrollbar, article pre::-webkit-scrollbar { width: 8px; height: 8px; }
    .sidebar::-webkit-scrollbar-thumb, article pre::-webkit-scrollbar-thumb {
      background: #d1d5db; border-radius: 4px;
    }

    /* ---------- 状态提示 ---------- */
    .loading, .error {
      text-align: center;
      color: var(--text-secondary);
      padding: 80px 20px;
      font-size: 15px;
    }
    .error { color: #dc2626; }

    /* ---------- 移动端 ---------- */
    .menu-btn {
      display: none;
      position: fixed;
      top: 14px; right: 14px;
      z-index: 60;
      width: 42px; height: 42px;
      border: none;
      border-radius: 10px;
      background: var(--sidebar-bg);
      box-shadow: 0 2px 8px rgba(0,0,0,.12);
      cursor: pointer;
      font-size: 20px;
    }

    @media (max-width: 900px) {
      .sidebar { transform: translateX(-100%); box-shadow: 4px 0 20px rgba(0,0,0,.08); }
      .sidebar.open { transform: translateX(0); }
      .content { margin-left: 0; padding: 24px 16px 60px; }
      .menu-btn { display: block; }
    }
  </style>
</head>
<body>
  <button class="menu-btn" id="menuBtn" aria-label="打开导航">☰</button>

  <aside class="sidebar" id="sidebar">
    <div class="site-name">🧠 个人学习笔记</div>
    <nav id="nav"></nav>
  </aside>

  <main class="content">
    <div class="content-inner">
      <article id="article"></article>
    </div>
  </main>

  <script src="assets/marked.min.js"></script>
  <script src="assets/highlight.min.js"></script>
  <script>
    // ---------- 导航数据(新增笔记时在这里加一行) ----------
    const NAV = [
      { title: '🏠 首页', path: 'README.md' },
      { group: 'C++ 篇', items: [
        { title: 'C++ 面向对象编程', path: 'C++ 篇/C++ 面向对象/C++面向对象编程.md' },
        { title: 'C++ STL', path: 'C++ 篇/C++ STL/C++ STL.md' },
      ]},
      { group: 'Python 篇', items: [
        { title: 'Python 数据分析', path: 'Python 篇/数据分析/Python数据分析.md' },
        { title: 'FastAPI', path: 'Python 篇/FastAPI/FastAPI.md' },
      ]},
      { group: '数据结构与算法', items: [
        { title: '数据结构（C语言）', path: '数据结构/数据结构（C语言）.md' },
      ]},
      { group: '数据库', items: [
        { title: 'MySQL', path: 'MySQL/MySQL.md' },
      ]},
      { group: '网络', items: [
        { title: '网络基础', path: '网络基础/网络基础.md' },
      ]},
      { group: 'Linux', items: [
        { title: 'Ubuntu Linux 命令', path: 'Ubuntu Linux 命令/Ubuntu Linux 命令.md' },
      ]},
    ];

    // ---------- 构建侧边栏 ----------
    const nav = document.getElementById('nav');
    const linkHtml = item =>
      `<a class="nav-link" href="#/${encodeURIComponent(item.path)}" data-path="${item.path}">${item.title}</a>`;
    nav.innerHTML = NAV.map(item =>
      item.group
        ? `<div class="nav-group">${item.group}</div>` + item.items.map(linkHtml).join('')
        : linkHtml(item)
    ).join('');

    // ---------- 配置 marked ----------
    // GitHub 风格标题 slug:目录链接(如 #1-基础篇)依赖它
    const slugify = html => {
      const text = new DOMParser().parseFromString(html, 'text/html').body.textContent;
      return text.toLowerCase()
        .replace(/[^\p{L}\p{N}\s-]/gu, '')
        .replace(/\s+/g, '-')
        .replace(/-+/g, '-');
    };

    // 同一标题出现多次时,GitHub 会依次生成 xxx、xxx-1、xxx-2
    let slugCounts = new Map();
    const uniqueSlug = base => {
      const n = slugCounts.get(base) || 0;
      slugCounts.set(base, n + 1);
      return n ? `${base}-${n}` : base;
    };

    const escapeHtml = s =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

    const LANG_ALIAS = { 'c++': 'cpp', 'plain text': 'text', 'plaintext': 'text' };

    marked.use({
      gfm: true,
      renderer: {
        heading({ tokens, depth }) {
          const html = this.parser.parseInline(tokens);
          return `<h${depth} id="${uniqueSlug(slugify(html))}">${html}</h${depth}>`;
        },
        code({ text, lang }) {
          const name = LANG_ALIAS[(lang || '').toLowerCase()] || (lang || '').toLowerCase();
          if (name && hljs.getLanguage(name)) {
            const { value } = hljs.highlight(text, { language: name });
            return `<pre><code class="hljs language-${name}">${value}</code></pre>`;
          }
          return `<pre><code class="hljs">${escapeHtml(text)}</code></pre>`;
        },
      },
    });

    // ---------- 路径与路由工具 ----------
    const safeDecode = s => {
      try { return decodeURIComponent(s); } catch { return s; }
    };

    // 规范化笔记路径:处理 ./、../、重复斜杠
    const normalizePath = p => {
      const parts = [];
      for (const part of String(p == null ? '' : p).replace(/\\/g, '/').split('/')) {
        if (!part || part === '.') continue;
        if (part === '..') parts.pop();
        else parts.push(part);
      }
      return parts.join('/');
    };

    const encodePath = p => p.split('/').map(encodeURIComponent).join('/');

    // 拆分 href 的路径与锚点(忽略查询串)
    const splitHref = href => {
      const hashAt = href.indexOf('#');
      const beforeHash = hashAt >= 0 ? href.slice(0, hashAt) : href;
      const fragment = hashAt >= 0 ? safeDecode(href.slice(hashAt + 1)) : '';
      const queryAt = beforeHash.indexOf('?');
      return [queryAt >= 0 ? beforeHash.slice(0, queryAt) : beforeHash, fragment];
    };

    // 把笔记里的相对路径按“当前笔记所在目录”解析
    const resolveRelative = (fromPath, relPath) => {
      const decoded = safeDecode(relPath);
      if (decoded.startsWith('/')) return normalizePath(decoded);
      const dir = fromPath.split('/').slice(0, -1).join('/');
      return normalizePath((dir ? dir + '/' : '') + decoded);
    };

    let currentFilePath = 'README.md';
    let loadToken = 0;
    let scrollTimer = null;
    let scrollToken = 0;

    const findAnchor = fragment => {
      const candidates = [fragment];
      const once = safeDecode(fragment);
      if (once !== fragment) candidates.push(once);
      for (const name of candidates) {
        const byId = document.getElementById(name);
        if (byId) return byId;
        const byName = document.getElementsByName(name)[0];
        if (byName) return byName;
      }
      // 兜底:按标题文本或 slug 查找
      const headings = [...article.querySelectorAll('h1,h2,h3,h4,h5,h6')];
      return headings.find(h => h.textContent.trim() === fragment || slugify(h.innerHTML) === fragment) || null;
    };

    function scrollToFragment(fragment) {
      clearTimeout(scrollTimer);
      const token = ++scrollToken;
      if (!fragment) {
        window.scrollTo(0, 0);
        return;
      }
      const doScroll = smooth => {
        if (token !== scrollToken) return false;
        const el = findAnchor(fragment);
        if (!el) return false;
        el.scrollIntoView({ behavior: smooth ? 'smooth' : 'auto', block: 'start' });
        return true;
      };
      requestAnimationFrame(() => {
        if (!doScroll(true)) {
          // 内容/图片可能还在渲染,稍后重试
          scrollTimer = setTimeout(() => doScroll(false), 120);
          return;
        }
        // 图片加载后布局会变化,再校正一次位置
        scrollTimer = setTimeout(() => doScroll(false), 350);
      });
    }

    // ---------- 页面加载 ----------
    const article = document.getElementById('article');

    async function loadPage(path, fragment = '') {
      path = normalizePath(safeDecode(path)) || 'README.md';
      currentFilePath = path;
      const token = ++loadToken;
      clearTimeout(scrollTimer);
      scrollToken++;
      article.innerHTML = '<div class="loading">加载中…</div>';
      setActive(path);
      window.scrollTo(0, 0);
      try {
        const res = await fetch(encodePath(path));
        if (!res.ok) throw new Error(res.status);
        const md = await res.text();
        if (token !== loadToken) return;
        slugCounts = new Map();
        article.innerHTML = marked.parse(md);
        fixImagePaths(path);
        setTitle();
        if (fragment) scrollToFragment(fragment);
      } catch (e) {
        if (token !== loadToken) return;
        article.innerHTML =
          `<div class="error">笔记加载失败:${escapeHtml(path)}<br><br>请确认已通过本地服务器打开页面,例如在仓库根目录运行:<br><code>python -m http.server 8000</code></div>`;
      }
      if (window.innerWidth <= 900) document.getElementById('sidebar').classList.remove('open');
    }

    // 笔记里的相对图片路径要基于笔记所在目录解析
    function fixImagePaths(path) {
      const dir = path.split('/').slice(0, -1).join('/');
      article.querySelectorAll('img').forEach(img => {
        const src = img.getAttribute('src');
        if (src && !/^(https?:|data:|\/)/.test(src)) {
          img.setAttribute('src', (dir ? dir + '/' : '') + src);
        }
      });
    }

    function setTitle() {
      const h1 = article.querySelector('h1');
      const text = h1 ? h1.textContent.trim() : '';
      // 首页 README 的标题本身已含站点名,避免重复
      document.title = text.includes('个人学习笔记') ? text : (text ? `${text} · 个人学习笔记` : '个人学习笔记');
    }

    function setActive(path) {
      document.querySelectorAll('.nav-link').forEach(a =>
        a.classList.toggle('active', a.dataset.path === path));
    }

    // ---------- 路由 ----------
    // 路由格式:#/笔记路径;可带锚点:#/笔记路径#锚点
    const parseRoute = () => {
      const raw = location.hash;
      if (!raw.startsWith('#/')) return null;
      const rest = raw.slice(2);
      const hashAt = rest.indexOf('#');
      const rawPath = hashAt >= 0 ? rest.slice(0, hashAt) : rest;
      const rawFrag = hashAt >= 0 ? rest.slice(hashAt + 1) : '';
      return {
        path: normalizePath(safeDecode(rawPath)) || 'README.md',
        fragment: rawFrag ? safeDecode(rawFrag) : ''
      };
    };

    const routeHash = (path, fragment) =>
      '#/' + encodePath(path) + (fragment ? '#' + encodeURIComponent(fragment) : '');

    const navigate = (path, fragment = '') => {
      path = normalizePath(path) || 'README.md';
      const next = routeHash(path, fragment);
      if (location.hash === next) {
        if (path === currentFilePath) scrollToFragment(fragment);
        else loadPage(path, fragment);
        return;
      }
      location.hash = next;
    };

    window.addEventListener('hashchange', () => {
      const route = parseRoute();
      if (!route) {
        // 非路由 hash:兼容手动输入的页内锚点
        const legacy = safeDecode(location.hash.slice(1));
        if (legacy) scrollToFragment(legacy);
        return;
      }
      if (route.path === currentFilePath) {
        // 同一篇笔记内跳转:不重新 fetch
        history.replaceState(null, '', routeHash(route.path, route.fragment));
        scrollToFragment(route.fragment);
      } else {
        loadPage(route.path, route.fragment);
      }
    });

    // 笔记正文中的链接:统一按当前笔记所在目录解析
    article.addEventListener('click', e => {
      if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      const a = e.target.closest('a');
      if (!a) return;
      const href = a.getAttribute('href') || '';
      if (!href || /^(?:[a-z][a-z0-9+.-]*:|\/\/)/i.test(href)) return;

      // 只写了 #锚点 的链接:留在当前笔记,但保留 SPA 路由
      if (href.startsWith('#')) {
        e.preventDefault();
        const fragment = safeDecode(href.slice(1));
        if (fragment) navigate(currentFilePath, fragment);
        return;
      }

      const [rawPath, fragment] = splitHref(href);
      if (!rawPath.toLowerCase().endsWith('.md')) return;
      e.preventDefault();
      navigate(resolveRelative(currentFilePath, rawPath), fragment);
    });

    // ---------- 移动端菜单 ----------
    document.getElementById('menuBtn').addEventListener('click', () =>
      document.getElementById('sidebar').classList.toggle('open'));

    // ---------- 启动 ----------
    const initialRoute = parseRoute();
    loadPage(initialRoute ? initialRoute.path : 'README.md', initialRoute ? initialRoute.fragment : '');
  </script>
</body>
</html>
